name: Cleanup Expired Videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Call cleanup API
        run: |
          curl -H "x-cron-secret: $CRON_SECRET" \
          https://twinflame.vercel.app/api/cron/cleanup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}